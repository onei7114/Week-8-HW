<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Canvas</title>
<style>
  :root {
    --ink: #1d2733;
    --muted: #657384;
    --panel: #ffffff;
    --bg: #edf2f7;
    --line: #d3dce6;
    --accent: #3e78c2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #dcecf4, var(--bg));
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: min(1050px, 100%); padding: 28px 16px 40px; }
  header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -.05em; }
  h1 span { display: block; color: var(--accent); font-size: .34em; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
  .toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px;
    padding: 14px; border: 1px solid var(--line); border-radius: 14px;
    background: rgba(255, 255, 255, .8); box-shadow: 0 12px 30px rgba(34, 57, 78, .08);
  }
  .control { display: flex; align-items: center; gap: 8px; }
  label { color: var(--muted); font-size: .82rem; font-weight: 700; }
  input[type="color"] { width: 42px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; }
  input[type="range"] { width: 125px; accent-color: var(--accent); cursor: pointer; }
  output { min-width: 42px; color: var(--accent); font-weight: 800; }
  button { padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--accent); outline: 3px solid rgba(62, 120, 194, .18); outline-offset: 2px; }
  .clear { background: var(--accent); color: #fff; border-color: var(--accent); }
  .canvas-wrap { padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 18px 45px rgba(34, 57, 78, .12); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; border: 1px solid #e4e9ef; border-radius: 8px; background: #fff; touch-action: none; cursor: crosshair; }
  .hint { margin: 12px 2px 0; color: var(--muted); font-size: .88rem; }
  @media (max-width: 700px) {
    header { align-items: start; flex-direction: column; }
    .toolbar { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>Make something wonderful</span>Art Canvas</h1>
    <div class="toolbar" aria-label="Drawing controls">
      <div class="control">
        <label for="color">Color</label>
        <input id="color" type="color" value="#3e78c2" aria-label="Pen color">
      </div>
      <div class="control">
        <label for="size">Pen size</label>
        <input id="size" type="range" min="1" max="60" value="10">
        <output id="size-value" for="size">10 px</output>
      </div>
      <button class="clear" id="clear" type="button">Clear canvas</button>
    </div>
  </header>
  <div class="canvas-wrap">
    <canvas id="canvas" width="1200" height="800" aria-label="Drawing canvas"></canvas>
  </div>
  <p class="hint">Choose a color and pen size, then click and drag to paint. Touch drawing is supported on mobile.</p>
</main>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const context = canvas.getContext("2d");
  const colorInput = document.getElementById("color");
  const sizeInput = document.getElementById("size");
  const sizeValue = document.getElementById("size-value");
  const clearButton = document.getElementById("clear");
  let drawing = false;
  let lastPoint = null;

  function updateSizeLabel() {
    sizeValue.textContent = `${sizeInput.value} px`;
  }

  function pointFromEvent(event) {
    const bounds = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - bounds.left) * canvas.width / bounds.width,
      y: (event.clientY - bounds.top) * canvas.height / bounds.height
    };
  }

  function beginDrawing(event) {
    drawing = true;
    canvas.setPointerCapture(event.pointerId);
    lastPoint = pointFromEvent(event);
    drawPoint(lastPoint);
  }

  function draw(event) {
    if (!drawing) return;
    const point = pointFromEvent(event);
    context.strokeStyle = colorInput.value;
    context.lineWidth = Number(sizeInput.value);
    context.lineCap = "round";
    context.lineJoin = "round";
    context.beginPath();
    context.moveTo(lastPoint.x, lastPoint.y);
    context.lineTo(point.x, point.y);
    context.stroke();
    lastPoint = point;
  }

  function drawPoint(point) {
    context.fillStyle = colorInput.value;
    context.beginPath();
    context.arc(point.x, point.y, Number(sizeInput.value) / 2, 0, Math.PI * 2);
    context.fill();
  }

  function stopDrawing() {
    drawing = false;
    lastPoint = null;
  }

  function clearCanvas() {
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "#fff";
    context.fillRect(0, 0, canvas.width, canvas.height);
  }

  sizeInput.addEventListener("input", updateSizeLabel);
  clearButton.addEventListener("click", clearCanvas);
  canvas.addEventListener("pointerdown", beginDrawing);
  canvas.addEventListener("pointermove", draw);
  canvas.addEventListener("pointerup", stopDrawing);
  canvas.addEventListener("pointercancel", stopDrawing);
  canvas.addEventListener("pointerleave", stopDrawing);
  updateSizeLabel();
  clearCanvas();
})();
</script>
</body>
</html>
